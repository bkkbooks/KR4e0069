body:
  text: 鵝湖集卷四明龔斆撰記秋丁壁記洪武十有四年秋八月五日秋上丁也常歲舉祀成均具太牢以省部官攝獻至是先三日則以命本學祭酒臣某重斯文也前期一日百官具服侍班聽傳制于奉天殿祭酒率司業博士助教正録二十四人從欽上命也暨回獻官致齋于教樂廳不與雜務嚴祀事也其日自晨及申風雨交作暮稍止人皆曰以聖天子報祀之誠攝獻官承祀之篤君臣一心寧不有格于帝加以聖人在天之靈文運方盛當不為慮也夜參半雲翳四除天地澄霽星斗煥爛河漢昭回爼豆既陳牲幣既設攝獻官端笏立殿下百官景從庭燎有輝樂舞交作降登興伏環佩珊然牲酒極豐粢盛甚潔配哲從祀分獻畢舉洋洋在上咸若格思退而官僚師生舉手交賀皆曰祀典之盛天意之符莫此若也于時陪祀者六部官若干人翰林院官若干人太常寺官若千人通政司官若干人御史若干人侍從官若干人春坊官若干人應天府縣官若干人欽天監官若干人本學師生若干人學官則某某牽連書之白雲茆屋記國子祭酒仲敏宋先生為余言滑水之濵有佳處焉地曠而壤肥草木蕃廡可耕可鑿可樵可漁民俗以醇生齒以息吾家於斯舉十世矣誅茅結構朴而不華負郭而郊居有琴書詩酒之娛無市塵聲利之接軒楹間悠悠揚揚招之不來揮之不去者惟白雲耳因扁之曰白雲茅屋好事者寫為圖以見寄余宦遊京師往來乎翰林胄監者數年矣寢食弗忘吾白雲茅屋也披圖一觀景與心會子其為我記之余曰嗟夫大抵富貴利逹者之未遇也未有不放曠山林傲睨軒冕者逝將終老乎清泉白石間至其出而用於時也綰墨紆朱登金步玉回視前日遊息之所不啻弱水之隔蓬萊也有能不忘其貧賤所操守者蓋亦寡矣先生獨不忘於是豈有説焉先生家本中原世為官族蚤歲以明經取科第羈紲仕途蓋有慕乎白雲茆屋之趣而莫得者也繼而兵革騷動四方靡寧雖欲求吾白雲茅屋之安而莫適者也晚際明時橫經太學又將酬其白雲茅屋之願而未遂者也儻得一遂所願則千駟萬鍾能移其志耶今老矣且莫有歸休之樂矣觀書之暇逍遙相羊將見白雲長存茅屋無恙前花後竹左圖右書於斯時也天下之樂又孰有加於此乎余備員司業與之同僚者二年以其説有默契乎余心乃不辭為之記上饒縣新修學記上饒舊學在府城西去城二里許元末燬廢不存國初禮樂未興不遑暇者又十餘年乃洪武庚戌始詔天下郡邑興學校置教官訓導之員選民間俊秀子弟入學肄業維時上饒令丞多故未能作新於城西北隅草創學舍數楹卑隘殊甚後三年玄黓困敦春永嘉林從事永以經學充貢于朝來尹兹邑至學之頃顧瞻徘徊嗟嘆久之詢于衆曰廟可後乎曰不可非廟無以祀先聖曰廡可後乎曰不可非廡無以祀先哲復曰學可後乎曰不可非學無以善後進乃白之大府白之守禦官府官某某守禦官某某咸是之議以府治後之東度地經始焉庀徒鳩工出俸以給餽食掄材於麓陶甓於滸書夜弗休息期年而學建又期年而廟成於是師生有授受之地官僚有薦祼之所既完教諭汪珵美訓導薑彛歐陽謨來請記歲月余曰古者家有孰黨有庠術有序國有學皆所以明人倫也自三代迄今斯道不廢良以是夫君以之歌頌太平臣以之尊君親上庶人以之移風易俗所以振起綱常扶植世教者豈細故哉三代而下文風之盛莫宋若也德祐之季武臣倒戈恬不為異死難輸忠無非學者載在青史厯厯可觀由是論之學何負於朝廷哉吾黨身任教職幸際明時惟當勉力不怠期無負聖天子嘉惠斯文之意其於歲月本末則不可不書繞林巡檢司新創廨記江南地多險阻界乎饒信之間者曰文山其地山髙而崖谷深道隘而草木盛倉卒有變鄉民率據險自固習為故常往往拒命官府患之元末居民恃其要害反覆不常者二十餘年本朝汛掃寰區削平姦宄華夏蠻粵係頸闕庭至洪武二年山之餘蘖猶固守出沒為民害弋邑為甚焉主簿潘某雖屢率丁民備禦稍獲平寧而盜之根本猶未拔乃圖狀上聞議以邑之北鄉繞林創置巡檢司以扼其吭朝廷可其議庚戌以滁人孫茂夫來董斯任即其地置巡檢司府縣擇民之強壯者驗丁糧設弓兵百人以付之始至百務未集人皆難之未幾賊悉悔過為良民茂夫相地之勢披荆棘畚土石鳩僝徒官舍鼓樓舉合法制若固有之事不勞而集賊不殄而平且三年矣民皆德之咸願勒諸石以識其美來徴余文因為詩以美之皇朝受命奄有萬方蠢爾山冦乃敢陸梁饒信之區古稱厚俗不悍而剛不阿而睦文山逆黨何獨不然憑險負固為亂之源弋邑在邇不遑寧處雖有良民誰能禦侮州縣上議設置徼巡謂此繞林據其要津首命茂夫職任斯稱付以弓兵百爾強徑銜命斯來誓不俱生忠憤所激不殄而平芟其蔚蕃鉏其阻險樵牧耕桑一無舊染早衙夜鼓詰慝刑姦惟懷永圖匪曰壯觀吠犬不驚流移休息民咸曰嘻斯宰之德願識厥美勒之堅珉刋此頌聲以勸後人許存衷歸田記余曩年嘗識清漳許存衷於燕山於今二十有六年矣旃蒙單閼秋蔡君孔昭來尹上饒孔昭則存衷之外姪也首詢存衷無恙未幾漳郡馮廣文性初以領薦還道兹邑乃得奉狀問起居明年其嗣某來獲復書慰答因索余歸田之文余何靳一言以續久要之好存衷漳之右姓也其居在龍溪郭外若干里有良田美池可耕可釣築室種樹決渠灌花自足終老之身無所事乎功名矣所以不遠萬里涉江泝河旅寓幽燕﨑嶇海岱者蓋將得祿以榮其親也由是自定南寨徼巡官一再遷秩府縣親亦榮矣中值變故兵革屢興存衷復倦於仕途乃翁以八十之齡垂白堂上不欲貽憂膝下一旦遂棄祿歸耕蓋將盡菽水之歡於晨夕也昔潘安仁嘗曰太夫人在堂有羸老之疾尚何能違膝下色養屑屑從斗筲之役乎因賦間居歸田以自見今存𠂻之心殆倣佛乎安仁矣遂為之記而系以詩云清漳之濱龍溪之濆青洋之村有田一墟有宅一區許子之廬元運將窮漳民洶洶弄兵起戎城郭破殘武臣怠官邊郡膽寒許子靡寧倡呼白丁奮揚義聲不日掃除誅其凶渠民奠厥居稂莠既芟錫爵實堪官于定南晚值搶攘職名屢更公論弗行嚴君耄期旨甘或違翩然以歸賣刀買牛易其田疇紓親之憂青洋西東禾黍芃芃允為良農長稚檀樂歲時欣歡遺之以安久闕贈言記其歸田千里饋焉南溪舊隱記南溪舊隱者國子博士茶陵談子發之别業也由其地在茶陵之陽故曰南溪以其上有先人退休之居故曰舊隱茶陵於湖南為文獻之邦談於茶陵又為禮義之族南溪得山川之秀擅丘園之美市塵無侵聲利罕接誠負郭之佳處也元末兵革四興故家大族悉為丘墟南溪地迫闉闍去家密邇談避他邑辛勤來歸故宅靡存改卜其上因復初元先生為題南溪舊隱四字故名焉洪武壬戌冬余為國子司業時談適為博士與之遊者六七年屢以記為請江右雖西接湖南余不及一親迹其地昔弗及知今弗及見何以記為因諗之曰子之南溪也昔也必有茂樹修篁竒花異石可以遊目適情者固無恙乎曰無有也必有亭館陂池髙堂廣厦可以燕遊止息者固無恙乎曰無有也曰若是則竹樹荆榛池臺瓦礫矣謂之舊隱者何哉然而兵燹之變四海皆然不特爾之茶陵也廢興之事古今皆然不特爾之南溪也縱不能保之於既往獨不能振之於將來乎改卜之説固其宜也近年以來附郭之地至難保也不見侵於官府則見奪於世家得僅存者亦寡矣今南溪猶為青氊故物夫豈偶然也哉水光山色可以映帶左右者猶在也煙雲卷舒可以怡悅旦暮者長存也池可以漁畦可以蔬肯堂肯構有其人矣可濯可湘有其地矣可以來清風可以招明月數椽之居萬間之厦無不可者有志者事竟成也談悠然而笑曰是未足以盡我之美也吾上世家藏經史圖畫及宋先輩所述遺文若干卷雖在羇旅危困間未嘗闕失此乃非他族所可及先生其以是記之余既重其請復閲其書味其文贊之曰得其所哉得其所哉墨池書屋記墨池書屋者太學生潘奎讀書之室也因其居之旁水色如墨故號墨池乃宋翰林羅孟郊之故居曰翰林堂者是也地在廣東惠州之興寧縣生築室于翰林之故基而以墨池自號豈將追蹤古人耶古人以書名世者無過乎鍾元常王逸少也余嘗於興國得元常之墨池矣復於臨川得右軍之墨池矣惠州東坡蘇公謫宦之所坡之翰墨亦無愧於鍾王斯池豈以蘇而得名耶生今肄業于太學矣躋仕版有期矣茍能以鍾王書法繼美于蘇公焉始有踐夫墨池之迹吾知異日池水之墨又有甚於斯時者茍為不然雖盡烈徂徠之松為煤以泚之亦無補也生頗有志於學故記此以勉之云風木軒記人子養親之日有限思親之心無窮此人事有不齊非人心不相似也故有盡甘旨於耆艾之年有奪供養於齠齓之日其所遭有幸不幸者存焉是皆天也非人之所能為也存而養沒而思或歡焉或戚焉但盡吾心舉不失其為孝矣永嘉塗君叔乘性至孝好讀書自幼不省恃怙但知有思親之悲而不知有養親之樂者每讀詩至蓼莪篇未嘗不掩卷涕泣此非其所遭之不幸者與闢軒數楹寢食其間因取吾丘子木欲靜而風不止子欲養而親不逮之説顔之曰風木軒以寓其孝思不忘之意軒之左右茂樹蔚然時當卉木萋萋淑景將暮霜露既降枯梢號寒於斯時也風木之思愓然豫懷若割創巨矣介其友人某徴文於余記之余曰悲夫叔乘果知風木之説乎大扺世人於親之存也率不知事親之樂也及其沒而知焉則已晚矣風之未動木也亦不知靜之為美也及其呼號奮激搖撼不止而後知焉則亦末如之何矣借使塗君親不亡養不衰不知其心亦知其為樂否乎蓋必知之矣余謂塗君之不幸又有甚於他人者世有處貧窮患難而不能盡其養者有之矣至於富貴而思焉每懷不自足之心如仲由者未如塗君之幼孤一不能身親其養其思慕之心當何如耶君昔為胄監生見同舍有告歸省謁者而不與焉今居官見同僚有以祿迎養者而不與焉寧不有動乎中耶由是而思親之痛愈深而風木之悲愈切矣遂為之記蘭竹軒記嘗思古人寓意於物矣或美其才或美其德二者固皆足以寓意焉然才之可取莫若德之可尚也上饒傅夢野以蘭竹名其軒人皆以為取其才吾獨以為取其德傅上饒故家居于玉水之湄舊宅燬于兵燹更卜數椽棲息其間藝蘭盈階種竹繞舍裴徊徜徉與之為徒亦久矣蘭則怪石嵌空紫莖緑葉幽香旖旎可佩可紉露花葳蕤誠可以玩目而適情矣竹則葉如翠羽筠如琅玕曉月嬋娟緑影滿地隆景晝赫清風徐來誠可以湔塵襟而祛流俗矣此特其才之美也在他人觀之則以夢野之所尚者在斯而名軒之意亦在於斯余則以為不然古人有言曰與善人居如入芝蘭之室則蘭固善人之儔矣又曰竹存君子之操則竹固君子之行矣此乃其德之懿也夢野之在鄉邦也鄉邦稱善人在友朋也友朋稱君子善人君子固夢野之素履取以名其軒豈在此而不在彼與然則楚畹淇園舉不足為吾夢野之輕重矣深造軒記余為胄監之明年昭武張原哲謂余曰吾鄉三華山閩山之最佳處也岡麓之竒林壑之美有不可得而備述者焉泉清石白竹翠松蒼掩映蔽虧干態萬狀騷人詞客過之者莫不恱其竒勝終不能一朝以居豈天地鬼神所祕惜不輕以畀人耶吾鄉吳定翁居之定翁自元末佐治建郡覩世事日變遂棄官晦迹於斯築室種樹引流鑿池日與良朋益友徜徉其間或瀹茗清談或斗酒相樂故邑之賢人君子亦往往樂與之遊闢軒數楹顔曰深造蓋有取乎孟軻氏之説也以書介原哲徴文於余余家信之鉛山與昭武接壤室邇人逺未獲一迹其地姑以原哲所稱道者為之記焉大抵求道之心人皆有之往往不能深造其域者由其剽竊緒餘耳聞而道聽以是欺世駭俗而曰我能深造吾未之信也蓋必真有得於其心則居之安資之深而取之左右逢其原矣此窮理盡性工夫豈日用常行之道比定翁顔以是説必有自得之學矣余老矣奔走於圭撮之祿不能髙蹈逺引以相從於心寧不自愧它日或得遂余歸老之願青鞋布襪弗逺數舍陟岧嶤越巖谷一往觀焉志願足矣故樂書所聞以為定翁記夀萱堂記夀萱堂杭州李愚若虛養親之所也堂在仁和其地爽亢幽隱背郭面流有園池之美為屋數楹樹萱草數十本雜以竒花異石四時蔚茂南窗北牖凊溫有其處焉山樵水漁旨甘有其具焉顔曰夀萱良有以也嘗讀衛風伯兮之詩有曰焉得諼草言樹之背由昔人久别懷思視諼草以忘吾憂如見其人耳然情愛之鍾莫切於子母也若虛之心豈不以出處不常恐貽線衣之念欲其親視萱草無恚以忘其惟疾之憂而寓之斯耶謂之夀又若虛愛日之誠一喜一懼俾永其親年以待它日鼎茵之養耳非萱之夀也親之夀也李故家大梁父遊宦於杭因僑居焉父早喪鞠於母孟氏孟氏今六十有九矣謂之夀萱也宜哉天朝文治大興萃天下古今書籍板百萬計將以同天下之文也簡編錯亂召四方文士翻閲之若虛應召以來晨昏銓次幾一寒暑思親之念常往來于懷屢請一言以為夀萱堂記於是乎書雪窩記國子司業吳性傳先生即其寓館中庭之後闢一室焉髙廣不數尺置一榻其中僅可容膝墁以白堊素潔可愛號曰雪窩以為晨夕燕息之所絶去聲利流俗脫然先生年甫踰六旬而龎眉皓首公暇之頃婆娑其間日光玉潔人室輝映四時如冬俗眼觀之不啻越蓬婆而望西嶺也謂之雪窩不亦宜乎屬余記之先生莆田之老儒也與余雖有江閩千里之隔晤言則未而姓名出處彼此相聞洪武庚戌朝廷興舉學校余分教廣信先生分教莆田俱十年不調秩去年秋同被召為四輔官居月餘同以老病乞歸田里今年夏又同召入國子學仕止進退心同迹同皆不期而遇雖平昔久要未有若是其巧者余焉得無一言以紀其實先生涉獵經史於傳記百家靡不考索稠人廣坐議論風生見者莫不以為老於學者今聖天子崇重斯文一新胄監先生宜橫經講學啓迪英髦振起儒宗以聳四方之觀聽至若汛掃一室遊焉息焉乃異時歸老之心非今日所宜事者誠未足以鋪張其美也雖然邵堯夫一代偉人猶以安樂窩自奉是則雪窩之記余所以慨然而不辭愛日堂記越胡本道築室于諸暨之舊廬將以復先業也以愛日扁其堂以養其親也不曰愛親而曰愛日意有在也夫愛親之心人所同然或在或亡謂之愛日不可也惟矻矻孜孜惟日不足頃刻弗亡于懷乃愛日之誠耳且日行于天晝夜循環嵗月如流匆匆不返昨之如漆者今日而星星矣今之渥丹者明日而枯稿矣孝子之心得不愓然而懼耶春日載陽淑氣和煦南薰時至晝景舒遲秋陽熙熙殘暑盡退霜晴冬愛祈寒自溫當此之時親之樂無涯孝子之心得不躍焉以喜耶本道越之右族也少孤奉偏慈之訓學業底成中值兵革避地鄰邑辛勤來歸築室種樹其地盡旨甘溫凊之奉故有是名母夫人趙氏故宋大丞相鼎之裔孫本道則元進士筠翁之外姪一中之猶子也歲辛亥本道領薦為玉山丞後二年來需余文遂為記四德堂記元亨利貞乾之四德也元者善之長亨者嘉之會利者義之和貞者事之幹此四德之原於天而具於人者也一見於易之文言一見於春秋左傳孔子不曰本之春秋穆薑不云本之易其古有是説邪吾不得而知之矣信之玉邑翁氏顔其居曰四德堂其有取乎易邪抑有取乎春秋耶吾亦不得而知之矣翁氏曰舊築堂於邑之南鄉去郭無半舍為屋若干楹背山臨流竹樹交映棠棣爭秀桂蘭齊芳是扁也意謂上世積善之深嗣續之逺始則聚族於居後世散處他邑世次日久歲月愈多昭穆一失遂成塗人皆由譜系不明之故也今欲祖孫相承别以編號則雖百世之下綱舉而目張蓋天道始於元故一世而元二世而亨三世而利四世而貞五世以下别立字以繼之斯堂之扁將以為一宗姓之權輿也需余文記之余曰古者天子因生以賜姓此得姓之所由始也翁之得姓亦久矣其散在天下者不知其幾千萬指使其初有能如士白因世系以統一之何患昭穆之不序耶嗚呼元以下固可得而言焉元以上則無可考矣余既有以慶其將來而復發往古之一慨以其有關於世教也甚大於是乎書郭氏望逺樓記余嘗究觀事物之理矣有期於心而責其必然者有不期於心而得之自然者是皆有一定之天初不在乎人心之期否也如射之一發而破的此心之所主在於必中謂之無所期不可也如空谷之應聲聲發於此而響應乎彼謂之有所期亦不可也廬陵郭氏築室於秀溪之上顔之曰望逺樓夫樓者可憑髙而縱目意其地必有平原曠野江山開闔煙雲卷舒一覽千里之勝暇日可以遊目登眺如韓子所謂升髙而望逺者乃不然也其意以為自上世積纍至今子孫猶能以詩禮世其業自今以往豈無一二子孫復能以詩禮昌吾宗耶徴諸上者其逺既如彼望諸後者其逺又如此非以遊觀景物之樂之美求自快於一時也此有期於心而責其必然者郭氏與有焉或曰是心也人皆有之孰不願其後嗣子孫之賢而有千駟萬鍾者哉顧得之不得則天也何必期望哉余曰不然昔漢于公治廬舍謂梓人曰為我髙門我治獄未嘗有寃後世必有封者宋王晉公手植三槐於庭曰吾之子孫必有為三公者厥後西平侯果能踐于公髙門之言魏公果能成晉公三槐之志由是而知責必於天者必有所主於中非妄為之説也古人有為之者豈必郭氏哉嗚呼郭氏其亦有主於中否乎遂為望逺樓記明志堂記江南山水之秀無過於錢塘人生其間亦皆秀出而頴異非他郡可及豈髙厚所鍾不能盡泄其靈氣而發于人乎何其濟濟之多賢也秀才李燁錢塘之白眉也年少而質美學博而才富其上世自淮遊宦江南僑于錢塘之餘杭縣洪武丁卯以邑庠充貢太學戊辰以善書選入中書科兩年之間再遷文翰亦可謂出類拔萃者矣其故居東瞰西湖西對天目讀書其間徐子常為題其扁曰明志意有在焉需余文記之余曰汝亦知子常之意乎蓋謂錢塘湖山之美適足以喪人之良心此志之不可不明也若夫平波曵藍疊巘攢翠荷香桂子釣叟蓮娃固可以供斗酒篇詩之娛矣有志之士不在于此也壺觴縱橫獻酬交錯歌舞彌日管絃沸天固可以偷一晌之樂矣有志之士不在於此也然則志何為而見耶古人有言曰志於道德者功名不足以纍其心志於功名者富貴不足以纍其心故自聖門觀之如顔淵季路之各言爾志子路曽晳冉有公西華之各言其志則道德功名不較自可見矣今子之志也其在於道德耶其在於功名耶吾知其不在於富貴矣此正君子之所當明子常之意或在於此介石圖記進士何奎西江之儒家子也其居在南昌之璜溪嘗築室溪上讀易其間扁曰介石蓋取諸豫六二介于石之義也洪武甲子肄業邑庠丁卯升入太學明年戊辰舉進士得一圖大不盈尺危石古藤狀甚險怪有確然不可奪之勢心甚愛之以其有合於昔日名齋之意也裝潢為軸需余文記之余觀豫之為卦其貞坤其悔為震雷出於地其奮也勃焉故為恱豫之象六二中而得正較之上下之溺于豫者大不相侔此介于石之占所以有取於斯也其在人也茍有快於其心者必悅悅之甚則欲動情勝而樂生焉由其易以溺人之心溺則失其正而反憂故不得不介于石以防制之此作易聖人假象示人之微意也奎也家學有源於易深明進退存亡之幾初年學之有成頗有悅豫之心慮其悅之過而或怠故取此以戒謹之繼而榮名鄉貢又繼而榮登科第安得而不悅豫哉矧今成名方盛之年而父母俱存兄弟無故又安得而不悅豫哉在他人則喜溢于辭色間奎也惴惴焉猶恐吾斯之未能信非有安靜堅貞之德其能介然如石而不陷於悅豫之久者乎由今不以富貴榮利悅於心而以道之在我者為悅焉養親則菽水盡其歡俾悅不在已而在其親處兄弟則怡怡焉盡其友愛俾悅不在已而在其兄弟是則介如石之心不以宦成而或忘其不終日貞吉也宜哉吾想其名齋未有斯圖也斯圖之作未必為名齋設也齋創於彼圖得於此其偶然耶非偶然耶不可知矣
