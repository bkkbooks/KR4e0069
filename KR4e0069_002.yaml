body:
  text: 鵝湖集卷二明龔斆撰詩吳伯舟歸養括蒼山下白雲飛漢水江頭綵鷁歸微祿可能三釡養逺遊應是五年違庭闈有夢關山隔鄉邑無書故舊稀不為鱸魚心獨苦黑貂幾誤老萊衣次韻萬益謙半載飄蓬兩鬢華又驚春信入梅花昔貪朝市風雲闊今愛山林嵗月賖縱步且須留謝屐倦遊何必怨張槎勞君故有詩相寄隨意行吟到水涯偶因行役過君家山路迂廽菊有花濁酒懸知留我待香粳不用喚兒賖舍南久有歸田耜户外今無上漢槎最愛蘭蓀芽競茁一經埀訓足生涯徴君雖老尚昻藏珍重斯文與有光詩比杜陵方近古賦如賈誼却升堂披離蒲桞當門緑奕葉芝蘭傍砌香尚有惠連春草句夢回清興滿池塘白髮相看勢利忘德星千載聚文光庾郎久不依蓮幕嚴武何曽顧草堂霜樹錦楓留客醉露叢黃菊噀人香此翁近亦無機事拍拍輕鷗水滿塘送張邦英别歸㑹稽桞怯春寒未放綿故人歸思倍凄然蘭亭日日堪携酒剡水時時好放船微雨輕塵催去馬翠烟芳樹老啼鵑知君更有重來約不用看雲白晝民其弟邦秀信郡長目司也以訪邦秀回故用少陵憶弟看雲事贈毛生兄弟從父守禦四川綵袖雙曕難弟兄錦江萬里計修程舟行灩澦風生楫家近蓬婆雪滿城諸葛勳名新將略二蘇文采舊家聲浣花溪上多才思莫為馳驅廢短檠松江釋信中孚鏡觀頌秋水泓泓混太清本無色相自虛靈𡨕心似覺身為幻過眼空疑影附形好為空花除妄滓莫將止觀泥殘經檐頭探取中孚畫歸對包犧問姓名送貴溪張尹丁父憂還家花縣春風桞絮飛傳聞茂宰有歸期都門莫訝雙鳬逺山鳥應嫌匹馬遲堂上琴門公事少沙頭酒盡客心悲孤篷夜雨郵亭晚掩涕長吟陟岵詩寄友人金陵自古帝王州水碧山青節氣柔夜雨催殘黃菊晚西風吹老白蘋秋千家月色連天白萬户砧聲接地稠兩載鄉音無使到豈無鴻鴈在汀洲寄永福寺友人劉潤芳故里雲松不厭看又飛金錫度長千鍾山得似芝山好道海何加學海寬羡爾心如禪定久愧豫身與客氊寒自從别後音書隔天外征鴻字字安江東遊子問歸期之子何心去魯遲臨汝雪晴宵剪燭武陵花落晝哦詩百年士論歸名節十載交情倚夢思明日重來尋舊約春風携酒看靈芝贈人使回皇皇使節自東來千里雲山瘴霧開官渡解鞍憐騕裊郵亭看劍拂塵埃魚龍水濶波聲逺梅桞江春暖氣回欲買小舟聫後載弱流今已隔蓬萊贈傅謐之官泰寧丞百里傳呼二尹來理民須仗濟時才舟行越水鯨波息路指閩關瘴霧開羣吏不須鈐紙尾蒼生無復墮顛崖橋門此日難分手千里馳書慰老懷贈陳積慶之官宜黃令西江寸水少波濤令尹傳聞得俊髦百里可能淹驥足三年漫爾試牛刀文昌閣下琴書靜華蓋峯前雨露髙底事橋門重分手催科撫字要心勞寄貴溪令張伯孚三載橋門麗澤深寫詩聊記别來心半江自剪吳淞水百里休慙枳棘林客散郵亭青嶂晚鳥啼公館緑槐隂催科畢後無餘事長日須彈子賤琴贈鐵松鐵色蒼官出澗阿風霜飽歷歲年多根蟠翠石猶存礦雨溜青銅不改柯鎖甲凌雲空自脫㦸枝臨水亦難磨公輸歐冶休相顧留取清隂覆緑蘿天地為爐萬木焦長松依舊翠岧嶤洪都一柱苔空老赤碧千年㦸未銷澗底氷霜明節鉞林間風雨聽簫韶矢人莫把髙枝剡留與夫差射海潮贈畫師徐碧澗幾度山齊聒夢醒風泉石瀨㵼清泠雲隂半染松邉黑苔色全添雨後青人帶殘陽歸谷口鶴翻清露滴林坰如今收拾新圖裏始信徐生筆有靈贈筆生徐原圭三絶吳興價最髙品題何待見吾曹南山未必無清節東郭爭知有俊髦吏部文章徒炫美中書官賞不酬勞玉堂賴爾能揮灑尚寫新詩换錦袍贈松江王千里太守回蒼梧司業王嘉㑹弟也舊是東吳隱逸人忽看飛斾擁朱輪一年夢隔三山曉千里恩涵五嶺春鈴閣雪消梅蘂重彤墀風暖棣華新遙知父老郊迎日樽酒黃堂介夀頻贈中齊身侍紅雲戀白雲誓將大節報君親玉皇香案三呼日金母瑶觴一笑春天上星辰髙北斗人間草木耀南閩聖朝孝治隆千載指日恩霑紫誥新海月夀吕養浩碧落空明翠欲流滄溟東角暮雲收光搖銀闕三山曉冷漾氷輪六月秋五夜潮回蟾影浴九天風動桂香浮廣寒分取長生藥穩泛仙槎訪斗牛瑞洪夜泊三月江南雨滿湖魚吹花浪鳥相呼踈燈照水夜明滅逺樹入雲山有無澤國田磽人剃草酒船風靜客摴蒱桞隂不見埀綸者却道煙波是畏途春日登臨川青雲亭故址青雲亭子有遺基曉踏春陽信馬蹄十載干戈愁裏見百年歌舞夢中迷雪消華蓋三峯出雲捲金臺五石齊風物不因城市改酒酣歸路欲雞栖滕王閣髙閣凌空嵗月徂王生文字已糢糊黃麻莫為青蚨賜綵筆能將粉蝶圖澤國波濤仙島逈重城煙雨蜃樓孤遊人不識興亡恨惟解臨風倒玉壺薌溪道中不因行役愛追遊處處長亭得少休官道行人看虎跡野塘稚子拾雞頭青山已是三年别華髮堪為兩鬢羞溪上梅花仍有約莫將歸夢付淹留三山磯三山直上與雲齊海色蒼茫楚水西波浪不驚沙鳥沒蒹葭無盡塞鴻低風生野戍旌旗閃日落荒村虎豹啼莫向鳳凰臺上望遙遙空使客心迷八月十六夜泊塢子寨示祝權塢子巖前江霧開瑞州河口北風回南山一㸃青螺小鄱水千羣白鴈來明月尚圓天氣好良宵虛度客心哀故園松桂無人管只恐秋霜兩鬢催女兒港剩水殘山自古今美名何必直千金防身未識姑嫜禮擇配那知父母心眉黛眼波春思濶野花山葉暮愁深猶勝思婦髙樓上一曲離歌淚滿襟與睦州甘彥初同知同過弋陽晚泊十年重過弋陽溪野店山橋處處迷烏鵲攢枝驚虎嘯獼猴曽過學猿啼客行官道霜猶濕人醉郵亭日未西說與睦州賢别駕好因凋瘵問蒸黎弋陽道中偶乘小蹇度山阿記得當年舊所過雲護早霜晴不穩路穿隂嶂濕還多野人生計渾全薄行客鄉音一半訛滿眼黃蒿能幾闢邉頭何苦用干戈蟂磯廟姑熟江頭浦溆廽雲岑煙島翠崔嵬樓穿蜃氣波心出山戴鰲宫海上來石見早知潮水落風生逺見客舟開天教逈隔江淮壤不著遊絲㸃緑苔過赤壁赤壁爭雄又幾秋江波不斷古今愁風腥逺水魚龍混草沒荒城鹿豕遊樊口斜暉穿樹出漢陽孤嶼接天浮年光不逐豪華去賸有殘碑記竹樓次韻吳自修遊南巖南巖地偏罕人跡問君胡為來此遊偶因人生閒暇日况當天下承平秋飛泉自落屋西畔青山只在巖上頭招提境界不易到松篁一徑通深幽溪南十里南巖寺老柏經年泣象龍林屋山光春皎皎石闌雲影午重重勝遊佳客身親到惠寄新詩手自封南渡老臣遺墨在想因忠憤久填胸再過上饒夜宿城南逆旅狂客征衫不自由緑隂啼鳥豈知愁半簾曉月湖邉柳一片夕陽山外樓水落漁翁尋釣石風來梢子促行舟兩年三度經行此羞對東風話舊游鳳凰臺聞說髙臺有鳳凰如今芳草思茫茫山環帝里南來盡水繞石城西去長蘷樂九成春寂寞秦簫三㺯月荒凉綵雲一假無消息幾樹梧桐老夕陽五老峯詩贈南康守敷淺原頭列嶂開湖光倒浸碧崔嵬九江滙澤流山雪三峽飛泉吼石雷李白新題蒼蘚合匡君舊隱白雲堆好將拄笏朝來意付與黃堂酒一杯蓮花峯清塘山色碧如流荷葉荷花幾度秋太乙仙人青玉舫沅湘詞客翠雲裘平湖逺逺連舟渚芳草青青隱鷺鷗晚雨漸乾霞鶩散教人虗泛採蓮舟女兒港阻風老屋踈籬半掩門斷煙踈柳幾朝曛雨昏潮口生春水天入江東有暮雲山翠猶疑粧淚濕眼波如恨寶叉分豈無漁笛蒼茫裏埀老飄零不忍聞遊雞鳴寺和伍助教朝賔不為嬉遊廢簡書偶承恩命得歡虞吳中緑樹今無恙洛下青山舊不殊蕭寺飛甍齊㟝嶁胡僧尖帽織氍毹太平有象無人識願播仁風被海隅突兀禪關隱薜蘿閒扶藜杖一來過蒼髯楚客留篇什碧眼胡僧禮貝多南澗露芹分璧水北橋煙桞拂金河相逢莫說無生話雪案螢窗要琢磨化人宫殿倚巍城獨立憑髙眼倍明僧設番茶澆磊磈童燒山葉煮清泠人間白馬何年返天上金雞半夜鳴南望鳳臺應咫尺朝陽還聽舜韶聲雞鳴之上接清廟畫棟翬飛出林杪馬埒風髙苜蓿秋鳳臺日上梧桐曉雲消天宇山色明潮落江堤水聲小埀老何因樂意多吾皇整頓乾坤了過潤陂客裏深思行路難歸心何事更盤桓風回水國波聲小雪滿江天鴈影寒莫把驛程思逺近祇憑鄉夢報平安因嗟白髮催人老青鏡流年仔細看過湖口寄東吳故人天塹茫茫水國分徼巡鼙鼓隔江聞櫓聲搖落山頭月帆勢衝開嶺上雲拜舞近辭丹鳳闕去留今共白鷗羣九華秀色青如筆欲寫交情逺寄君仙人石石上仙人去不回洞門深鎖白雲堆鹿行澗底窺瑶草鶴過松隂步紫苔初起無心成久立子房多病盍歸來等閒識得尋真路千樹桃花次第開過望夫石獨立長亭望眼空江波有盡思無窮啼痕暗滴莓苔雨瘦骨寒生薜荔風萬里音書何日到百年恩愛此心同天荒地老名難泯不比巫山一夢中碧筒飲笑遣芳樽吸緑荷風絲撩亂粟芒多湘妃小蓋擎波出太乙仙船載酒過玉露引香通鼻觀碧雲分影照顔酡獨醒楚客應嫌此故剪秋衣换緑蘿故山敝廬不庇風雨告歸補葺述事興懷玉川破屋不全拋若比揚雄缺解嘲稚子何心守環堵旁人應笑捲重茅誰憐門樹烏三繞自愛雲松鶴一巢安得萬間寒士庇無令風雨蘚痕交池口阻風懷故人東流宰周德平莫向池陽問酒杯好懷應為故人開九華山曉千峯出三峽江寒萬里來塞鴈未隨南陸轉楚雲多逐北風回浮名本自無羈絆應笑先生白髮催登滕王閣故基髙閣千尋俯緑波波心倒浸碧嵳峩西山雞犬雲中去章水魚龍影裏過煙艇客眠洲渚靜風櫺人醉管絃多重來上指㸃曽遊處芳草連天一土坡題金溪洪氏孝思亭道上春風吹客衣亭前碧草淡春暉憑髙忽若瞻雲起倚杖空懷負米歸水落江寒氷未解土暄林茂筍初肥吾生最亦思親苦飄泊深慙與願違題洪都鐵柱觀西江江上有靈湫上有仙人碧玉樓百尺露莖埋故國千年砥柱屹中流曽漂蜃氣歸瀛海不謂龍泉出劍州誰遣戎衣塵溷久股肱聞已進謀猷南風吹海不成波江右生民喜欲歌𤣥化九天如有賴神功千古自難磨夫差箭落江潮避溫嶠犀然水怪過塵劫未能同幻滅好將銅狄共摩挲遊先天觀上清宫殿五雲飛名占先天識者稀不向虛無參妙訣却於圖象探𤣥機中天日月開黃道列座星辰拱紫微誰是虗皇壇上客夜深清露挹霞衣武石潭阻水雨過千村水自生梢人驚起又三更舟移似覺山平轉雲動應疑月倒行楊柳蒹葭渾莽蕩鸕鷀鸂鶒亂喧爭家鄉有路歸心切欲棄同舟豈我情餘干舟中偶成越水交流野徑偏短篷斜繫竹林邉楊花亂逐波心落鷗鳥不驚沙上眠春雨蒹葭人喚切晚煙洲渚客愁牽溪東即是桃源路却笑漁郎不放船松門石鏡在彭蠡湖中蘚痕零落翠光沈磨洗空煩雨露深璧月髙秋懸太古海天紅日散微隂久無粉黛窺鸞影還有蛟龍避水心江客草年頻過此繁霜殊覺鬢毛侵孤山梅鶴莫將梅鶴等閒看慣與幽人共考槃吟盡暗香還有月夢翻清唳不知寒單于午夜聲初咽華表千年墨未乾何似水光山色裏無言相對只盤桓晴天廬阜匡山髙處接雲涯突兀遙瞻滙澤西拂曙嵐光浮劍㦸排空清氣豁端倪岷峨地接南條盡吳楚天連北斗低寄語東林陶靖節漁郎今在武陵溪湖天一色水色天光帶晚晴泓泓澄碧湛虗明欲看一鏡涵秋影不著微雲㸃太清星斗外窮千里目波瀾中混古今情落霞孤鶩滄茫裏萬頃瀟湘畫不成清鏡環翠百頃湖光一鏡開好山多處路縈廽長松落落凌空出緑樹隂隂繞澗來晴日暖雲舒錦繡淡煙踈雨暗樓臺吳歌楚舞俱陳迹惟見春風長緑苔唐明皇遊月宫自是君王厭萬幾凉天清夜夢魂飛素鸞並駕歸瑶闕廣樂旋聞奏羽衣蟾兔那知天廣大山河不礙日光輝翠華西幸蛾眉老始信人間事已非訪隱者不遇偶訪臨川處士家鍾山不受片雲遮林花色奪宫墻粉松葉香分石鼎茶心比彥倫須自愛學如康節厭人誇何妨共醉重隂下烏帽蕭蕭鬢腳華從軍人還鄉謁先壟去國辭親二十年歸來哀痛抱終天心傾葵藿風塵際淚灑松楸雨露前徐庶有懷方寸亂王陵多恨孝慈偏男兒立志存光顯㑹見功成晝錦還
