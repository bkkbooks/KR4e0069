body:
  text: 提要鵞湖集六巻别集類五明臣等謹案鵞湖集六巻明龔斆撰斆鉛山人明史無傳惟太祖本紀載洪武十三年八月丙午置四輔官以儒士王本杜佑龔斆趙民望吳源為春夏官而亦不詳其本末考鉛山縣志稱斆先以明經分教廣信輯朱子説補六經圖御史葉孟芳薦其學行徵入為四輔官以老乞歸又召為國子祭酒卒於官著有經野類鈔二十八巻盖亦窮經篤學之士也其集見於焦竑經籍志者六巻流傳甚尠程敏政明文衡黄宗羲明文海蒐採極博而均不及其名姓則亡佚乆矣今惟永樂大典尚頗載其詩文詩雖多沿元季餘波而清婉諧暢亦自琅琅可誦文則原本經術結搆謹嚴實能不愧於作者其送周倬張溥使髙麗序稱洪武十八年命倬等往封國王而明史髙麗傳失載其事又贈劉叔勉奉使西洋回序稱洪武二年春詔叔勉往使三年夏纔至西洋而明史浡泥傳乃稱三年八月命御史劉敬之往使閲半年始抵其國年月參錯不合自當以斆所記為得其實是亦足以資考證也謹掇拾薈稡仍依原目定為六巻著於錄乾隆四十六年九月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:e1d9ffc14abef01b9f819194d2ad3d5072aabc987c63889a4c1b05bd5ee69bcc
