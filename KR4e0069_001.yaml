body:
  text: 鵝湖集卷一明龔斆撰詩題施安友于堂稽山蒼蒼越之故疆惟子之居肯構肯堂塤篪相須華萼聨芳孝友之性發乎天常道與時泰名與世昌金玉怡怡德音弗忘凊溫有宜就養無方旨酒嘉肴吹笙鼓簧秋月澄霽春日載陽綵袖齊翻于鄉有光稽山峩峩越流息波爾弟爾昆如江如河立孝惟親立敬惟和賢哉閔生名冠四科橋門之南産蘆蔔如貫珠十七八內官以為瑞獻之皇明屬休運聖澤流無方雨露所霑被穹祇獻嘉祥奎壁麗中天昭昭煥文章精華入厚土變化珠玉藏橋門東南隅畦蔬茂且昌土酥生其間希異不可常纍纍若聨珠皎皎如截肪根懸素瓊琚葉秀青琳琅老圃事灌溉內侍誇才良得之不敢餐金盤獻明光喜氣動天顔薦祼心弗忘神靈式昭格時羞匪蒸嘗謂宜比瓜瓞兆此百代康金陵本形勝沃野千里強峩峩素王宫奕奕三鱣堂菁莪育羣英蘋藻流世芳甘美萃天和易充藜莧腸豈無同穎禾九穗歸魯邦豈無兩岐麥貽我來於皇嘉蔬孰與儔金芝産齋房人能咬菜根愈久名愈香草蔬本無情一旦升廟廊吾道日光輝聖夀天久長寄餘干徐仲敏髙克誠二良友兼贈彥明原祐丙午之夏余寓于越與二公相知及已未歲忽彥明原祐相過彥明則克誠之弟原祐則仲敏之子也我昔來華原適遭亂定初﨑嶇訪家室於邑返故廬維時方盛夏日永暑未徂問津川無航問道途無車山家得少休快此兼旬餘南州一髙士先卜王翰居晨夕相過從義髙意勤劬雲篷有賢孫萬卷藏家書時來候契濶詩酒仍相娛長松結夏蔭衆木枝扶疏笑語坐移日交契金石如不意旅寓間見此巢許徒由來十四秋荏苒流居諸片雲隔嗣音久闕鴈與魚諒彼懷舊心豈不長嗟吁兩地各皓首濩落真成迂髙生尚黑頭已喜登天衢斯文固有幸不免勞馳驅松茂柏須悅彼智此則愚郡齋雨初晴燕坐鱣堂虛有客忽相過攬衣問誰歟衣冠出名門濟濟文義俱話間得出處使我心疾除明時需才賢鄱陽古名區况乃賢父兄家世耽文儒賤貧豈不樂榮逹多憂虞行藏在用舍與世同卷舒朂哉二君子必則寧與蘧歸家盡孝友為政當何殊吾觀聖賢心老大志不渝周淡齋琴邉秋興遙岑隔雲煙空谷蔽榛莽何年發幽貞異境豁𢎞敞林寒碧篠生石古蒼苔上晨登撫瑶琴暮歸倚藜杖一鼓忘世紛再彈絶塵鞅猿鶴留哀音風泉答遺響誰持方壺圖為我淡齋賞知爾諧素心令人動遐想倣佛連郊墟蕭條異疇曩雖云雜喧囂毋乃異天壤喬木隂扶疏故園色凄愴安得從爾遊亦以長吾長題西莊贈王文奎下第後省親會稽文獻邦人傑乃地靈土俗無澆漓山水有餘清先民樂遁藏於焉解其纓棲遲族寓間百世流芳馨名郎邁時流髫齔若老成卜鄰西莊上迹晦心則寧黍稷被東阡桑麻藹前榮詩酒足自娛勢利鴻毛輕弱冠嗜經術詩禮聞過庭詞華發天藻俊造蜚英聲薦鶚萬里秋曝鰓千丈泠漆雕不我欺閭丘徒自盈虞庠重琢磨益友歡送迎翻思凊溫日不覺喜懼并明發乞歸省愧我非陽城翩翩孤征鴻搖搖雙斾旌路若過山隂為我觀蘭亭剡溪雖懷賢興盡宜宵征升堂問起居拜舞還自驚去時尚朱顔今朝鬢星星咄唶山澤癯亦能奮翹英况爾瑚璉器豈不圖騫騰鼎茵有其期菽水何足矜男兒志四方莫作兒女情題徐用之助教慈訓堂南州一髙士晦迹衢婺間六嵗失所怙立身何艱難髙堂有慈母盡瘁心力殫年甫二十四掩鏡啼孤鸞紡績事教養辛苦摧肺肝歲時奉祭祀雞黍供盤餐殷勤冀成立宗嗣得無患子母命相依影隻形更單兒身壯有室母心方燕間乳下三歲兒况復哀煢鰥保抱恤疢疾衣食防飢寒三世各一身誰不為悲酸人願天弗違竟使嗣續完母頭既垂白兒亦雙鬢斑綵衣戲堂下五色紛斌斕凊溫適母宜甘旨盡母歡樹彼萱草花慈訓誰與顔慈訓不可忘恩重如丘山賢孫誨上庠耿耿心寸丹有志在補報無時涕汍瀾求詩紀其實千載為興觀題山水及古松扇面橫橋壓長溪髙樹倚絶壁草屋何人家開門候佳客清風招不來白雲渺無迹毋使元規塵汚我遠山色長松生澗阿絹素尺不盈昻藏煙霧姿蕭騷風雨聲梁棟固有朋山林豈無情少留天地間嵗寒保堅貞悅椿堂漆園有椿松鬱鬱生澗阿鳳葉青參差虬枝碧嵳峩氷霜久凝沍雨露頻漸磨髙視天壤間閲歷年歲多下結百畝隂上懸千丈蘿秋天立蒼鏐春風響鳴珂中有純孝人築室數仞過滫􅔱事甘旨志養親色和白魚入厨饌黃雀在網羅鯉庭多燕間怡顔盻庭柯柏府方筮仕庭前烏尾訛願推孝養心四海霑餘波蓮花峯羣山如龍驤回瞰北郭門四顧原野開川谷雄吐吞坡陀顯巒麓蒼翠連丘樊自笑蓮花卑始覺太華尊青天削芙蓉倣佛難具論鵝湖有良田藹藹阡陌分秋風禾黍登春雨桑柘蕃茍非耕鑿勞曷以供晨昏侯侍郎庸迎養東萊有客人中英滿腔忠孝由天生讀書不作章句陋居官所期肝膽明往者嚴君困三宅父子東南五千隔孤苦零丁十五秋一别何曽見顔色兒年初學數與方父不少留兒涕滂慈闈紡績事教養執經問道親虞庠前載春官取科第父若有聞心亦喜朝朝秉筆在鵷班情幾欲陳行復恥聖恩如天願弗違詔許馳驛迎親歸拜辭闕下一喜懼消息近日無安危雲山萬重隔閩越見面有期思愈切來日非如去日多舊愁不與新愁别天風吹衣道路長聖君寵厚親夀康炎州瘴霧避爽氣桑榆晚景昭回光遙知入門問安否百歲千歡交肺腑秉燭渾疑再世逢稱觴更盡中腸語歸來感激謝君恩枯朽一旦生陽春周公拜前魯拜後滿庭光顯難具論子祿愈豐親愈夀此事人生亦希有别恨何嫌地渺茫孝心直與天長久丈夫志氣今古同為子必孝為臣忠纍茵列鼎足榮養更以勳業垂無窮贈吳興陸頴筆花軒吳興製作天下竒筆花名軒誰與題霜毫插架千萬枝棗心蘭蕊芳菲菲固知文房有至寶雨露涵漸為誰好自是春風筆下生時人只道花開早贈沈翥由儀部遷宿州學正江頭日日春風起栁花飛渡春江水東吳客子問歸期回首雲山隔千里昔來胄監知幾秋鱸魚不動鄉關愁五車萬卷恣搜索聲譽早播金陵州筮仕春官咸見許每接蘷龍趨步武中原文獻久荒涼復遣橫經施教雨屠羊反肆未足多斆學亦得重漸摩乃知天造有深意千古不用傷丘軻次韻翁好古道過薌溪寄别黃二守十月流澌不成凍異客他鄉只如夢玉溪邂逅忽盍簮青眼相看各神竦萬里番禺不倦勞此身端為斯文重豈無獻賦誇甘泉豈無勳策圖凌煙丈夫犖犖自有志立身行道非偶然孤猿獨鶴渺何許新詩滿幅來鸞箋要追蘇李凌鮑謝肯與餘子爭媸妍薌溪之濵有逆旅清興留人不能去信知王事有程期千載風雲一朝遇鶂路何曾限吳楚大舶中流夾雙櫓明朝回首隔鍾陵水闊天低雨如霧湖心夜宿田家問道官陂訪舊田家住在鄱湖側僻處湖鄉㕓市隔自言三世在此居自幼何曾識賔客上官托宿叩我門旋掃階除已昏黑呼婦出門供水薪童稚驚竄呼不得庭中爇火燎衣裳厨下燒湯洗泥滓莫嫌忩户多風寒剩把蠶筐障簷隙湖魚旋網味差甘粳米新炊飯少白今年秋旱田不收無酒可沽君莫責明朝飯罷整行裝緩步從容莫匆迫門前有路到官陂莫過橫塘向東北中秋之夕分憲張侯以陸羽泉煎茶分惠昔有仙人陸鴻漸性嗜苦茗心骨清崕泉石甃舉品第好山處處留佳名建溪顧渚得異品惠山之外惟中泠琵琶洲前千越溪鐫石作竈留山坰龍涎傾臼古鼎翠星火迸石寒煙青蓬萊弱水恍不隔一啜世纍鴻毛輕靈山之陽東岡麓井冽寒泉皎如玉何年鑿破太古心云是仙人手親掬乃知往者未足珍此茗此泉當絶倫誅茅卜居總為此一丘一壑聊栖真汲清瀹碧匪曾倦咫尺市㕓少相見髙情不免留人間却著茶經二三卷爾來寂寞千載餘山荒石老人丘墟樵夫牧子罕知識山僧野老空長吁西江分憲列仙輩暫屏喧囂駐旌斾雲關霧幌豁然開剩水殘山價增倍踟蹰歸馬來自東飄如翳鳳乘天風百年窮逹固有異萬古髙義將無同官舍歸來細烹汲飛翠浮光毫濕韋布書生例見邀髙牙大纛嗟何及寒儒未必工文章三碗浪説搜枯腸佳期三五夜不寢起舞皓月回清光妻孥大醉我獨醒仰看桂花月中影欲讀茶經且復休漫寫狂歌發深省安得相從賦石鼎移忠寺人生自古誰無死蓋世功名只如此丈夫事業在致君要把香名照青史欺君賣國將謀身讒言搆禍誅功臣身雖富貴國僅免舍生取義為何人荒墳蕭蕭秋草歇翁仲含羞向誰説君不見西湖之上嶽王祠常有遊人拜忠節餘干舟中偶成蘆花如雪楓葉丹石崖細菊花班班漁翁收釣煙水寒栖烏啞啞啼夜闌篙師清晨理輕楫手把黃蘆掃霜葉白頭老父一何忙兩脛﨑嶇趁朝涉岸頭孀婦啼嗚嗚兒猶在乳家無夫江南地冰最宜麥縱有耒耜誰人扶聞道如今一陽復賀使紛紛相繼躅彼蒼回斡四海清大地春和吾亦足題耕樂圖賈將軍才且雄右手挾槊左挂弓用如雕鶚搏秋風狐兔不敢藏蒿蓬偶辭朔雪望南斗小試良才醹溪口十里朱旗畫鼓迎三年白帽青山走良田百畝溪之濵徼巡警息民風淳花村晝間緑野闢山犬不吠犂牛馴將軍不嫌祿厚薄公暇應能事耕鑿體倦那知有苦辛心間自以耕為樂小麥青青大麥深平疇水滿秧浮針農家嵗計在一飽一飽寬盡將軍心薌溪之濵有逆旅野興留人不能去布穀啼開緑樹煙鷺鷥飛斷青山雨將軍底用身親耕居官所期教化行民有恆心有恆産放僻邪侈何由生吾家老遂誰能續解使豪強變雍睦潢池赤子休弄兵刀劍從今盡牛犢秋江送别圖贈臨川人應召君不聞吳江秋蓴鱸之興難淹留又不聞楚江秋琵琶撥盡相思愁秋江之别不可送今古别離只如夢陽關三疊酒一樽富貴功名竟何用故鄉雲樹長青青故鄉父老難為情揮鞭落日一回顧十里五里長短亭馬鳴蕭蕭趲行色舟子艤船官渡側鷓鴣啼罷嶺猿哀目送行雲一凄惻汝之水旴之川秋波淡淡秋山連離情莫為江波牽家山一别心茫然飛鴻滿天秋色裏悲風瑟瑟中夜起采石江邉悵望人至今萬斛愁難洗何人寫此秋江圖使我一見重嗟吁江淹之賦説不盡離愁别怨無時無桃源圖桃源之景清且間秦人避世居其間竒蹤一撇不復見但見萬疊皆雲山當時豈不戀鄉土急欲逃生免愁苦初期一去即來歸豈謂家成遂終古梯空涉險身忘疲提擕襁負聲嚘咿豁然世外得絶境太朴未鑿無澆漓良田可耕樵可牧香稻堪炊酒堪熟明年春雨長桑麻剩種紅桃滿溪谷桃花開後知春深鶯啼燕語花隂隂飛英不合泛流出勾引漁子來相尋山翁漁子不相識倚棹相看問疇昔炎祚承平八百秋更無人解傳消息衣冠爼豆將無同送迎猶是秦人風黃雞白酒可留客歸心不用殊匆匆盡醉姑留一宵住明日相辭出山去扶舟傍岸覔來蹤水闊山髙不知處為張邦英題錢舜舉折枝梅花西湖美人風韻竒玉為資質氷為肌江梅向暖開南枝美人與之同襟期月香水影有妙句橫斜浮動無人知世間凡卉不敢並香名萬古芳菲菲羅浮美人亦大好笑靨盈盈破春早明日蕭條客夢醒參橫月落春光老怊悵松林不見人多情翠羽空相惱繁花亂插滿頭歸芳心寂寞憂心搗吳興美人真可人興來亦寫梅花真竒竒怪怪發天趣斯須幻出江南春疏花綽約有生意鮫綃半幅無纎塵固知佳畫不易得百年誰復藏其珍朝雲不入梨花夢鈴閣無聲畫屛凍淑態偏嫌夜雪欺幽風不許春風動意態娉婷冨貴羞精魂冷落清寒共時揩病目一摩挲萬紫千紅竟何用山隂古多圖與書張郎自是山隂癯平生愛畫入骨髓得此置之座右隅我生亦有畫梅癖對此不覺形神俱含丹吮墨我不如還君此畫長嗟吁方壺墨竹為劉亨道題粉箋錯落生篔簹琅玕翠羽參差光玉堂夜半秋雨涼西風瑟瑟吹鳳凰金門羽人方壺老曾向方壺拾瑶草晚嵗歸來長萬竿清隂滿地無人掃清隂不掃真可憐殘陽曉月爭嬋姢戲拈秃筆一追寫却立四顧心茫然劉郎展玩不忍釋邀我題詩寫空碧此詩此畫非等間願爾卷懷聊自適石日晷歌它山之石玉可攻嶙峋鑿破精磨礲幹支參錯定南北髣佛辰極居其中形如倚蓋奠鰲足圎若璧月當青空周遭百刻分晝夜毫釐不差理莫窮昆蟲草木識節序孰謂造化無全功昔聞姬公宅洛邑度地測景分西東短長已足辨寒暑朝夕更可期隂風我言物固各有遇片石亦得竒遭逢萬牛輿至九鼎重聖恩已許留辟雍璿璣玉衡屹相向占候彼此將無同學如不及有謨訓寸隂莫遣成匆匆瓊臺珠露尚厭浥朝陽已映扶桑紅國子先生正師席衣冠濟濟皆儒宗謇豫桑榆尚未晚不用顧影嗟轉蓬一線頻添足自慰八磚影過成踈慵鱣堂絳帳深重重從容退食方自公摩挲晷刻日將午更以經史開羣蒙鼠鬚筆貍奴與爾休爭雄兔頴為爾無全功毋持兩端廢科斗直變五技為雕蟲中書晨將黑貂珥虗宿夜泊文昌宫班超欲投怒近器漫以心畫昭無窮望夫石歌一從藁砧去無心事機杼暮暮復朝朝凝情立江渚歸帆數盡不見夫夫不歸來心獨苦寧知幻化只斯須留得虛名竟何補胡不當初莫嫁輕薄兒貪名徇利輕别離何不終身學取秋胡妻採桑紡績為裳衣人心孰不戀鄉土百年會有歸來時汝夫若戍交河北天下有時征戰息汝夫若把竒䇿干王侯名成也合衣錦圖歸休烏栖故林狐正首丘丈夫安得長逺遊胡為朝望復暮望化作石頭在江上室中有兒堂上有姑姑老無所養兒幼誰人扶兒無母兮走煢煢姑失婦兮啼嗚嗚汝夫一朝還汝已化為石石在路傍夫不識夫心始悔不早歸石本無情豈相憶相憶知奈何有淚如雨空滂沱古來貞節人湮沒何其多石在天地間萬古不可磨石不磨名豈滅只恨恩情中道絶遂令江上逺行人見此應須悔離别君不見蒼梧萬仞湘水深竹上斑斑淚如血蛾眉亭煙光水色涵清輝兩山相對浮修眉一如美人斂態不自持又如新月倒影相照寒玻璃姑熟江梁山峽秋水無波緑於鴨不是新婦磯頭翠黛顰不是瑶池王母霜蕭颯翠顰日日空自顰秋霜蕭颯何時春未如青山緑樹萬古不改色坐看滄海生黃塵周如心溪莊八首聞説溪莊上先生舊隱居村舂間野水髙棟接茅廬城客朝携酒溪翁夜打魚功名身外事不醉復何如城南煙景好日晏渡溪遲一徑竹深處四簷花落時雨晴鶯喚友風暖燕呼兒境寂觀羣動悠然樂不支溪深才數里塵靜少波濤宿鷺便青草嬌鶯妒碧桃户當松徑黑橋倚石梁髙尚有絲綸在猶堪掣巨鰲昔人今已矣溪館為誰開野鶴穿雲去林鳩喚雨來松邉深澗谷花外小亭臺俯仰成陳迹披圖一快哉開徑通幽嶼臨流結小亭引來溪樹碧分得泮芹青燈火書連屋壺觴月轉庭因悲城市促塵土漫勞形故園雖久廢風景尚依然鷺起灘頭雪蟬吟澗底泉汀煙浮蒼莽野竹雜潺湲祖笏雖堪寶寧無二頃田氷溪清淺處瀟灑一菟裘竹色侵書幌荷香拂釣舟黃雲孤島沒落日亂山稠我亦淹微祿無因得少休主翁生事少佳興在樵漁野客陪尊爼朝官問起居月移忩上竹風亂枕前書寂寞百年後方知有寧蘧贈别二首金陵分手再江路歲華深日落鴻遵渚星稀鵲繞林行藏君獨善憂患我同心青鏡頻看髮毋令白雪侵歲律催遲暮鄉心適遁潛子鵝春餅細香菜晚羮甜茅岫山雲合桐灣客路淹幽栖如可卜囊罄亦何嫌
