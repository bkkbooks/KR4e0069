body:
  text: 鵝湖集卷三明龔斆撰詩觀早朝玉案分香下九關彤墀端笏列千官屠蘇且為新年飲象魏何妨浹日觀五色雲間簾影曙萬年枝上雪花寒可憐鐵甲邉頭將舞蹈山呼耿寸丹行素齋百年隨分度光隂性道淵源夙所欽紫閣彤樓春藹藹竹籬茅舍午沈沈蠻荆不廢鍾儀奏陳蔡何慙季路心此外全非天賦豫肯論朝市與山林耕樂為蕭大有題秧滿平疇花滿川犂牛將犢傍花眠鷺鷥飛斷橫塘雨布穀啼開野樹煙瓏上一蓑如昨夢隆中三顧是何年莫因微祿淹山邑負郭今間二頃田題永思卷為考功某人作寄迹銓曹嵗月深思親時復一霑襟風雲不隔關山夢霜露難忘簠簋心古道白楊聲獵獵西風荒草思沈沈旨甘久絶梧楸逺投筆長嗟屺岵吟為朱允升題盤谷序後黟上先生舊隱居登山臨水樂何如放懷不待盈樽酒投老仍耽滿架書鶴唳松間時對客騶鳴道上幾回車昌黎莫漫歌盤谷留與間身共卷舒題蒼雲軒滿谷篔簹緑未乾古苔深鎖萬琅玕無心隔斷千山曉不雨翻成六月寒碧幹初齊猶繞繞清隂如染自漫漫渭川煙景今猶昔誰復相從賦考槃題祝洞天薌溪小景林屋隂深鎖緑苔碧山當户小樓臺眼前此景不易得客裏好懷先自開鬼谷已難求倣佛天冠猶解寫崔巍靈峯未必無佳處怪底遊人不再來鬼谷天冠皆薌溪山名靈峯則上饒之山也為謝氏題椿桂聞昔燕山種德深靈椿丹桂兩隂隂一樽好為嚴君夀三釜終酬令子心竹帛流芳傳舊史丹青遺畫見新吟謝公不念蒼生苦髙卧東山自古今碧雲軒為程有恆别駕題太行西望路漫漫一片孤雲正好看尚有鶴書求放逸那無鴈字報平安宦情犖犖傷心苦歸興遙遙見面難何日綵輿迎養處斑衣庭下足清歡題句容宰王氏槐軒蟬聲凄斷午忩涼嘉樹隂深夾道傍雲影翠連書幌暗風花黃襯馬蹄香牛刀漫試絃歌靜蟻夢初酣嵗月長亦有雄文堪黼藻它年重上晉公堂題雙桂軒小山佳樹愛幽深並秀聨芳不作林一徑露華秋冉冉兩忩雲影晝沈沈天風浩蕩清無際月窟凄涼醉不禁寄語吳剛莫相惱須教接葉布庭隂題凝霏軒凝霏掩冉山巑岏歘忽變化渾無端春陽㺯霽曉光白暮隂閣雨秋意寒簷前樹色翠欲滴户外野花紅不乾風塵澒洞久莫到何時一借憑闌干為吳端題靜學軒境息塵空泰宇清祇將經史寄髙情四時門館無私謁半夜池臺有月明座客爭誇吳季子幕賔元是魯諸生蘭階桂苑春長好底用黃金遺滿籯題煮詩軒髙人心不負幽期小結華軒要煮詩夢熟池塘春晚後酒醒窗户月來時大羮不和杯中味獨繭長繅甕裏絲誰謂灞橋吟更苦蹇驢風雪夜歸遲聞説名軒意最佳詩成端欲咀英華微吟聲繞羊腸陌得趣香分石鼎茶墨沸秋濤濡棐几句融春雪透梅花熟來不費推敲力誰遣松風潄齒牙題洪都寫韻軒贈道士傅梅巖瑶館玲瓏結綺忩星姝曾此遇仙郎紅塵失腳煙霞逺青簡留心嵗月長墨漬春雲池水黑朱凝秋繭露華香金華不逺人間路説與休文恐斷腸涼翠軒故人結屋嚴灘上小小軒忩自不同風捲雨聲來枕簟樹移山色傍簾櫳秋清未覺鸞簫逺嵗久應嫌鶴帳空無限好懷歸未得懶題安字寄征鴻蘭室為隱君子題一别靈均九畹荒髙名千載為誰芳秋花亞佩瓊琚冷曉氣穿簾雨露香似有間情依澗谷那無清夢到沅湘半年有箇同心友與爾同登魯叟堂聞喜歸朝為雲南太守楊大本題近分旌斾守藩維強把征袍换緑衣越巂北來天路逺牂牁南下客船稀黃堂酒散燈花落鈴閣香銷蟢子飛遙想杏花春雨裏鵲聲爭報逺人歸聽春雨為茅山道士思親作茅山聽雨結茅茨意恐紅塵惹鬢絲步鶴紫苔春滿徑鳴蛙緑水夜平池粳稌已足災畬願衣線能忘簠簋思綵袖魚軒今已矣黃冠野服總相宜溪山舊隱為王宗禹題彭澤江邉桞莫栽銅陵茂宰亦歸來山中白酒何時熟籬下黃花幾度開林靜朝朝麋鹿過磯空日日鷺鷗回某丘某水猶堪指只恨如今半草萊掀篷圖寄友人水邉何處覔芳菲記泊孤山月影微杖屨不須求澗谷畫圖應遣入屛圍含章半掩春嬌面姑射低埀雪色衣江上重逢休問語别來何事久相違雪夜觀胡二令本道詩藁因題久别可人胡二宰近來詩思敻無同坡因海外文偏好杜向秦州句轉工漂泊有誰窺梗槩艱危自古見英雄乾坤怪得無清氣却在溪山浙水東時本道之訟未直尚留葛溪商山四皓圖白髮相看嵗月馳髙原深谷路逶迤巴卭霜後應無橘商洛春深正有芝秦漢運移終不仕唐虞世逺欲求之髙風不為儲皇出羽翼雖成事可疑題遊騎挾彈圖平明挾彈出新豐馳過宜春小苑東百囀流鶯深樹曉一畨新雨落花風路迷禁草連天碧衣染宫桃照日紅欲識平原公子意豈無遺恨五陵中題蕭可復隱士窈窕尋壑圖緑鬢蒼髯雪不侵蕭然肯與世浮沈溪山自得煙霞趣霄漢寧知雨露心澗底秋髙黃獨美松根春暖茯苓深柴桑有路無人識竹杖芒鞋到處尋題朝陽讀書圖送吳伯亮之官武陵茆屋書聲何處尋五峯旭日到林隂梧桐早漾踈簾影葵藿潛傾曉露心過隙白駒憐景急語梁玄燕識春深柴關好為吾儕掩莫遣秋波思入吟題明皇出獵圖錢舜舉畫皇州春滿雪消遲正是君王出獵時輦路塵昏雙鳳闕掖垣鶯繞萬年枝雲飛黃鵠鷹初健月滿雕弓馬載馳却憶內園供奉日鹿銜花去已無知題范蠡扁舟圖戰勝歸來萬慮輕不將身世纍浮名五湖儘有間風月兩國今無舊甲兵逺禍髙飛鴻鵠羽忘機深結鷺鷗盟春風拂柳吳江上莫為西施一動情月中桂自植蟾宫不計春開時風露滿衣巾簮花亦有乘鸞女倚樹元無待兔人萬斛天香浮海宇一枝雲影礙氷輪霜寒蠧盡吳剛老穩歷凡間世劫塵松歷盡人間幾劫灰要將真節抗徂徠皴皮向日龍鱗繞直幹凌雲鶴骨摧琥珀地深神變化茯苓根暖熟栽培棲身不是安居穴梁棟應須屬大材螢火化形腐草復何求飛去飛來得自由松徑黑時青磷出村塘密處火星流露華不濕輝輝夜月色那欺點點秋羣聚沙囊光可燭茅齋空費讀書油紅梅為張邦秀題鶴膝橫空緑玉翹頂朱新試不全嬌香凝暈臉春先轉暖溢丹砂雪易消殊色未知逢驛寄羣芳須讓賜緋朝早知塞北無人識别寫新詞付麗譙竹夫人二首萬古湘娥淚不乾南薰誰想又承歡炎天似愛氷肌好日暮翻疑翠袖寒脈脈閨情羞粉黛依依青夢倚琅玕可憐一榻風漪滿猶憶虛庭宿鳳鸞近見依依引鳳凰不因炎暑沐恩光玉肌涴汗漣漪碧素體含風粉黛香魂夢凄涼驚嵗月淚痕零落謝君王天寒自保堅真節莫倚長門怨夕陽夢故室絃絶誰憐孤鶴飛鏡空無復綵鸞棲丁寧舊話生前别損濕殘粧夢裡啼郢樹煙邉魂欲斷楓林青處路應迷客中為爾添愁思杜宇聲乾山月低挽魯修隱士已慕髙情厭市朝又看騎鶴上青霄延陵不惜留神劍宋玉何堪賦大招商嶺雲深芝翳翳小山月冷桂蕭蕭寒泉秋菊如堪薦擬向風林借一瓢投分憲萬僉事三十韻聖代敷文教臺官肅憲綱吏塵清上國化雨沐炎方華衮曽親補龍泉肯鈍鋩心腸堅鐵石聞望美圭璋氷皎當空月春隨滿路霜羽儀專楚地威望振饒陽壓水朱旗穩浮波彩鷁長自天埀德澤連郡仰休光持斧先求雋埋輪竟劾梁廟廊聲譽藹寰宇姓名香大本需培植斯文藉主張尊經傳魯史論道對虞庠喚友林鶯切推賢泮藻芳明明修禮樂濟濟重綱常往昔來徴辟愚蒙賴舉揚曉星隨去棹春雨濕行裝天意憐衰朽人心樂退藏不才淹嵗月多病愧冠裳忝竊三年祿寧窺數仭墻仲由先入室賈誼亦升堂宦拙官宜冷形勞鬢已蒼於時復何補揆道更難忘皂帽真慵裹青襟匪自強斯須成濩落積久見荒唐寡與朋簮少恆飢稚色涼致身難即鹿處世若亡羊客詫工齊瑟人歌類楚狂途窮遭白眼時難厄黃楊趨走非吾事飄蓬豈異鄉銘心知賞激拭目覩明良夀馬太守長律三十四韻海岱英雄地青齊霸主州大才天所靳名士古無儔籍甚家聲逺淵焉世德求儀型追往哲文雅邁前修光武那慙援常何屢薦周與時俱上下隨俗漫沈浮已得清貧趣寧知富貴羞荆山藏卞璞豐縣祕吳鈎呂尚先埀釣長沮未輟耰秖能穿鐵硯寧復敝貂裘治代文明晝徽音渙汗秋隱居求所志徴士拔其尤畫省陪尊爼彤庭拜冕旒旌麾辭上國繡斧按遐陬貪墨成深遁疲勞得少休共能歌德政誰復快恩讐命駕黃牛峽揚舲白鷺洲瞿唐髙不顧蜀道險無憂牢落憐工部精忠羡武侯傷心斜谷口懷古瀼西頭渤海情初浹膠東志未酬分符雖足賀遮道竟無由陋郭那淹足平波且順流饒陽迂宦轍彭蠡駛行舟緑野耕桑樂黃堂禮數優民心懷惠愛士論見歌謳尊酒介眉夀雄文賦逺遊聨翩伸祝頌交錯獻觥籌有道朱顔駐無心鶴髮留靈椿蒼翠晚丹桂緑隂稠美化行江漢儒風盛魯鄒芹宫鶯睆睆萍野鹿呦呦澤潤涵淵海風行速置郵鳳池需獻納麟閣待謀猷馬守密人名真由湖廣憲僉遷綿州知州就任除廣信知府喜吐納金丹之衎遊鍾山寺野樹遷鶯合官橋信馬通亂山晴入畫連觀曲成虹岸篠藏春碧林櫻墜晚紅客行青嶂外人倚翠樓東迢遞經禪塔迂廽謁閟宫梵天花繚繞宸翰玉穹崇蘭氣栴林霧茶香鷲嶺風草眠分下鹿雲射散歸鴻霸業銷沈裏江河指顧中幾人增感慨千古見英雄元日見馬御史貫千里山城御史過共看飛斾擁鳴珂履端自覺時方泰布令欣逢吉始和驄馬行春驕蹀躞豸冠簮曉鬱嵳峩紫薇香藹鳳毛集翠柏影斜烏尾訛民厚只今無獄訟官清何處不弦歌橫經每亦思南郡破敵真能繼伏波甘雨普天膏澤下清霜盈路早寒多光分雲漢三秋月𣲖出崑崙九折河詩向玉堂携綵筆酒從丹扆倒金荷渥窪澒洞來天馬牛斗光芒接太和聖代文章歸黼藻人心禮樂在漸摩春臺未必無氷蘗寒谷爭知有薜蘿淺薄匪才甘自棄蕭條吾道竟如何寤言幸竊斯文庇蚤夜銘心誓弗磨西巖樵隱一入西巖路杳茫華陽句曲漫蒼蒼霧霾荒磴青苔黑風滿石床髙樹涼幽谷鶯啼花似錦柴門犬吠月如霜觀棊邂逅歸何晚换酒從容醉不妨雲倒懸崖棲虎豹竹臨哀壑度笙簧鄰人愛覔胡麻飯野老宜分白鹿裳道在豈辭筋力倦迹踈猶恨姓名香餐芝嵗久渾商洛採蕨春深自首陽稚子晨昏陪笑語良朋雞黍問行藏輕蓑短笠情偏好大纛髙牙勢久忘亦有楩楠供雨露那無松柏困牛羊相逢一一煩珍愛材大終期任棟梁柬劉子縉省郎何處還堪一舉杯城南風軟少塵埃青山滿郭遊人醉芳草迎車使者來村店野橋郊逺近禪宫仙館路縈回落花隨意飄紅雨飛絮多情點緑苔詩思漫因臨眺得笑顔非為管絃開琅峯曉日光如洗靈岫春雲雪作堆樗櫟每慙淹薄宦菁峩今喜育英才轅門有鵠彎弧出泮水無芹採藻回檣燕留人渾不斷杜鵑啼血莫相催山中亦有桃千樹何必劉郎去後栽夀黃二守琮七言長律十六韻九月九日西浙澄波浸五湖平江王氣壓三吳故家禮樂新文運澤國山河舊霸圖昭代賢才誇奕世中州清淑出名都雲髙北海翻鵬翼塵滿南陽識鳳雛羣史六經那輟誦萬言九制不操觚場中䇿對三千字天上名傳第幾臚匹馬春風行隴華雙旌夜月過延鄜煌煌肘後懸金印濟濟腰間綰玉符中部琴堂思撫字上饒鈴閣聽傳呼溪山氷玉平安好錦繡文章世代無童子何知親較藝老儒猶幸借噓枯九年已喜陪髙義一見真如謁大巫南極星辰光照室重陽時節慶埀弧芳馨杳藹羅椿桂翠碧交加映竹梧珠玉未須辭瓦礫蘋蘩非敢薦潢汙夀觴欲折黃花泛不與陶潛共酒徒雜詠四首看山隨意出城東歸路行吟思不窮微月滿橋煙浸水朔風吹起暮天鴻故人别去我遲遲東望音書逈不知寒意逼人歸興懶市橋煙雨立多時行盡郊原不見梅一時鄉思上心來故山遙憶鵝湖路傲雪凌霜幾樹開越王臺上鷓鴣啼七里岡頭滑滑泥欲識故人無限意晚煙踈桞畫橋西胭脂梅不著京塵染素衣賞心還自愛芳菲晚來東閣無詩興帶得紅粧馬上歸舊是仙人萼緑華手持絳節弄朝霞何人與换南枝骨冷蘂疑餐伏火砂紅梅花冰雪姿容舊寫真一枝曽寄隴頭人相逢若問真消息為説江南别有春離述陂懵騰醉眼未全醒厭聽栖鴉逹旦鳴欵假踏穿楊柳月快人拂面曉風輕
